name: Test on a real server

# Downloads the real Vintage Story server, compiles the mod against the game's own DLLs, starts a fresh world
# with the mod installed and records what the EMC mapper did (every value and where it came from, everything
# still missing, the server log). Results are pushed to the "ci-analysis" branch, alongside small summaries of
# vanilla tool/board data used while developing the mod. Run it from the Actions tab.
on:
  # A push to a ci/** branch runs it too (with the compatibility mods listed below), for sessions that can't
  # dispatch workflows; the results go to ci-analysis-<run number>.
  push:
    branches:
      - "ci/**"
  workflow_dispatch:
    inputs:
      gameVersion:
        description: Vintage Story version
        default: "1.22.7"
      extraMods:
        description: Other mods to run alongside, as Mod DB mod ids (comma-separated, e.g. smex,exlib,ppex)
        default: ""
      resultsBranch:
        description: Branch the results are pushed to
        default: ci-analysis
      look:
        description: The Look setting to test (Default, Original or New)
        default: Original

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      VS_VERSION: ${{ inputs.gameVersion || '1.22.7' }}
      EXTRA_MODS: ${{ inputs.extraMods || (github.event_name == 'push' && 'primitivesurvival,wildcrafttree,herbarium,wildcraftfruit,butchering,fromgoldencombs,em' || '') }}
      RESULTS_BRANCH: ${{ inputs.resultsBranch || format('ci-analysis-{0}', github.run_number) }}
      LOOK: ${{ inputs.look || (github.event_name == 'push' && 'New' || 'Original') }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download the game server
        run: |
          set -e
          for name in "vs_server_linux-x64_${VS_VERSION}.tar.gz" "vs_server_${VS_VERSION}.tar.gz"; do
            if curl -fsSL -o server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/$name"; then echo "got $name"; break; fi
          done
          mkdir -p vs && tar -xzf server.tar.gz -C vs
          vsdir=$(dirname "$(find "$PWD/vs" -name VintagestoryServer.dll | head -1)")
          echo "VSDIR=$vsdir" >> "$GITHUB_ENV"
          ls "$vsdir" | head -60
          ls "$vsdir/Lib" | head -80 || true

      - name: Get client libraries if the server lacks them
        run: |
          if [ ! -f "$VSDIR/Lib/cairo-sharp.dll" ]; then
            curl -fsSL -o client.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_${VS_VERSION}.tar.gz"
            mkdir -p vsclient && tar -xzf client.tar.gz -C vsclient
            find vsclient -name 'cairo-sharp.dll' | head -1 | xargs -I{} cp {} "$VSDIR/Lib/"
          fi
          ls -la "$VSDIR/Lib/cairo-sharp.dll" "$VSDIR/VintagestoryAPI.dll" "$VSDIR/Lib/Newtonsoft.Json.dll" "$VSDIR/Lib/protobuf-net.dll"

      - name: Compile against the real game
        run: |
          set -o pipefail
          export VINTAGE_STORY="$VSDIR"
          dotnet build VintageE.csproj -c Release 2>&1 | tee build.log
          ls -la bin/Release/Mods/vintagee

      - name: Run a server with the mod
        run: |
          set +e
          data="$PWD/data"
          mkdir -p "$data/Mods" "$data/ModConfig"
          cp -r bin/Release/Mods/vintagee "$data/Mods/"
          # Other mods to test alongside (latest release of each that fits this game version).
          if [ -n "$EXTRA_MODS" ]; then
            ids=$(echo "$EXTRA_MODS" | tr -d ' ')
            curl -fsSL "https://mods.vintagestory.at/api/v2/mods/install-information?ids=${ids}&gv=${VS_VERSION}" -o extra.json || echo '{}' > extra.json
            cat extra.json; echo
            python3 - "$data/Mods" <<'PY'
          import json, sys, urllib.request
          info = json.load(open("extra.json")).get("data", {})
          for mod, r in info.items():
              if "fileUrl" not in r:
                  print("no file for", mod, r); continue
              url = r["fileUrl"] if r["fileUrl"].startswith("http") else "https://mods.vintagestory.at" + r["fileUrl"]
              dest = sys.argv[1] + "/" + r["fileName"]
              urllib.request.urlretrieve(url, dest)
              print("added", mod, r.get("recommendedUpgrade", ""), "->", dest)
          PY
            ls -la "$data/Mods"
          fi
          # A look other than the default, so the self-test can check it: ProjectE's originals for runs started by hand
          # (with ProjectE's sounds), the New look for pushes to ci/** (or set it with the "look" input).
          echo "{ \"DumpValuesOnStart\": true, \"CacheEmcValues\": false, \"SelfTestOnStart\": true, \"Look\": \"${LOOK}\", \"ProjectESounds\": true }" > "$data/ModConfig/vintagee.json"
          cat "$data/ModConfig/vintagee.json"
          cd "$VSDIR"
          dotnet VintagestoryServer.dll --dataPath "$data" > "$GITHUB_WORKSPACE/server-console.log" 2>&1 &
          pid=$!
          for i in $(seq 1 240); do
            if [ -n "$(find "$data" -name emc-values.csv 2>/dev/null | head -1)" ]; then
              echo "values written after $((i*5))s"
              for j in $(seq 1 30); do
                if [ -n "$(find "$data" -name selftest.txt 2>/dev/null | head -1)" ]; then echo "self-test finished"; break; fi
                sleep 5
              done
              sleep 5; break
            fi
            if ! kill -0 $pid 2>/dev/null; then echo "server exited early"; break; fi
            sleep 5
          done
          kill -INT $pid 2>/dev/null; sleep 15; kill -9 $pid 2>/dev/null
          cd "$GITHUB_WORKSPACE"
          tail -40 server-console.log

      - name: Collect results
        if: always()
        run: |
          pip install json5 pillow numpy >/dev/null
          mkdir -p analysis
          find data -name 'emc-*.csv' -exec cp {} analysis/ \;
          find data -name 'selftest.txt' -exec cp {} analysis/ \;
          # The mod built against the real game DLLs, zipped for release.
          version=$(python3 -c "import json;print(json.load(open('modinfo.json'))['version'])")
          if [ -f bin/Release/Mods/vintagee/VintageE.dll ]; then
            (cd bin/Release/Mods/vintagee && zip -qr "$GITHUB_WORKSPACE/analysis/vintagee_${version}.zip" modinfo.json modicon.png VintageE.dll THIRD-PARTY-NOTICES.md assets)
          fi
          cp server-console.log build.log analysis/ || true
          cp data/Logs/*crash* analysis/ 2>/dev/null || true
          for f in data/Logs/server-main.log data/Logs/server-debug.log; do [ -f "$f" ] && grep -iE "vintagee|vintage-e|EMC|error|exception" "$f" | head -3000 > "analysis/$(basename "$f" .log)-filtered.log"; done
          [ -n "$VSDIR" ] && python3 tools/ci_extract.py "$VSDIR/assets" analysis || echo "no game assets" > analysis/extract-errors.txt
          # The "New" look uses the game's own textures, which only the client has: list them (paths, sizes, average
          # colours) and draw the New look's models with them (look-new-preview.png, look-new-missing.txt).
          if [ ! -d vsclient ]; then
            curl -fsSL -o client.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/vs_client_linux-x64_${VS_VERSION}.tar.gz" \
              && mkdir -p vsclient && tar -xzf client.tar.gz -C vsclient && rm client.tar.gz || true
          fi
          clientassets=$(dirname "$(find vsclient -type d -name survival -path '*assets/survival' | head -1)" 2>/dev/null)
          if [ -n "$clientassets" ] && [ -d "$clientassets" ]; then
            python3 tools/ci_textures.py "$clientassets" analysis || true
            python3 tools/render_look.py assets/vintagee/config/vintagee-new-look.json analysis/look-new-preview.png \
              --game-assets "$clientassets" --missing analysis/look-new-missing.txt || true
          else
            echo "no client assets" > analysis/look-new-missing.txt
          fi
          echo "game=${VS_VERSION} commit=${GITHUB_SHA} run=${GITHUB_RUN_ID} extraMods=${EXTRA_MODS}" > analysis/README.txt
          ls data/Mods > analysis/mods.txt 2>/dev/null || true
          # What the other mods (and the game) say about the patterns in tools/ci_mod_grep.txt.
          [ -n "$EXTRA_MODS" ] && python3 tools/ci_mod_grep.py data/Mods "${VSDIR:+$VSDIR/assets}" tools/ci_mod_grep.txt analysis/mod-grep.txt || true
          ls -la analysis

      - name: Push results to the ci-analysis branch
        if: always()
        run: |
          cd analysis
          branch="$RESULTS_BRANCH"; branch="${branch:-ci-analysis}"
          git init -q -b "$branch"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Server test results for ${GITHUB_SHA} on Vintage Story ${VS_VERSION}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
