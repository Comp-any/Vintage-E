name: Decompile game classes

# Decompiles the named types from the game's assemblies (for reading how a mechanic works) and pushes the C# to a
# branch. The game's code is the game's; the branch is for reading, and gets deleted afterwards.

on:
  workflow_dispatch:
    inputs:
      types:
        description: Regex of full type names to decompile (e.g. "Clutter|Glue|Repair")
        required: true
      assets:
        description: Regex of the game's asset file paths to copy as well (e.g. "blocktypes/.*/chute\.json|hopper\.json"); empty = none
        default: ""
      gameVersion:
        description: Game version
        default: "1.22.7"
      resultsBranch:
        description: Branch to push the sources to
        default: ""

permissions:
  contents: write

jobs:
  decompile:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VS_VERSION: ${{ inputs.gameVersion || '1.22.7' }}
      TYPES: ${{ inputs.types }}
      ASSETS: ${{ inputs.assets }}
      RESULTS_BRANCH: ${{ inputs.resultsBranch || format('ci-decompile-{0}', github.run_number) }}
    steps:
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Download the game server
        run: |
          set -e
          for name in "vs_server_linux-x64_${VS_VERSION}.tar.gz" "vs_server_${VS_VERSION}.tar.gz"; do
            if curl -fsSL -o server.tar.gz "https://cdn.vintagestory.at/gamefiles/stable/$name"; then echo "got $name"; break; fi
          done
          mkdir -p vs && tar -xzf server.tar.gz -C vs
          vsdir=$(dirname "$(find "$PWD/vs" -name VintagestoryServer.dll | head -1)")
          echo "VSDIR=$vsdir" >> "$GITHUB_ENV"

      - name: Decompile
        run: |
          set -e
          dotnet tool install -g ilspycmd
          export PATH="$PATH:$HOME/.dotnet/tools"
          mkdir -p out
          for dll in VSSurvivalMod VSEssentials VintagestoryAPI VintagestoryLib; do
            f=$(find "$VSDIR" -name "$dll.dll" | head -1); [ -n "$f" ] || { echo "no $dll"; continue; }
            # The whole assembly as a project, then only the files whose name matches.
            rm -rf proj && mkdir proj
            ilspycmd -p -o proj -r "$VSDIR" -r "$VSDIR/Lib" -r "$VSDIR/Mods" "$f" > "ilspy-$dll.log" 2>&1 || echo "ilspy exit $? for $dll"
            find proj -name "*.cs" | grep -E "$TYPES" | while read -r cs; do cp "$cs" "out/$dll.$(basename "$cs")"; done
            find proj -name "*.cs" | sed "s|^proj/||" > "out/all-types-$dll.txt"
            tail -5 "ilspy-$dll.log" || true
          done
          # The game's own json (block and item definitions), for reading how a block is set up.
          if [ -n "$ASSETS" ]; then
            find "$VSDIR/assets" -type f | grep -E "$ASSETS" | while read -r f; do
              rel=${f#"$VSDIR/assets/"}; mkdir -p "out/assets/$(dirname "$rel")"; cp "$f" "out/assets/$rel"
            done
          fi
          ls out | head -80

      - name: Push to the branch
        run: |
          cd out
          git init -q -b "$RESULTS_BRANCH"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Decompiled $TYPES from Vintage Story $VS_VERSION"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" "$RESULTS_BRANCH"
